name: Publicar web

on:
  schedule:
    # Cada 3 horas (hora UTC). GitHub puede retrasar unos minutos las tareas programadas.
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Descargar precios y generar la web
        run: python -m generador

      - name: Guardar el histórico diario
        run: |
          git config user.name "repostar-barato-bot"
          git config user.email "84066619+AlvaroGomezz@users.noreply.github.com"
          git add historico
          if git diff --cached --quiet; then
            echo "Sin cambios en el histórico"
          else
            git commit -m "Histórico de precios $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
