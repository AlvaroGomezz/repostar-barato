# Ajustes de la web. Cambia estos valores y la próxima publicación los aplicará.

nombre = "GASVIA"
lema = "Gasolineras baratas cerca de ti, con los precios oficiales de hoy"

# Dirección pública de la web (sin barra final). Cuando compres un dominio, cámbiala.
url = "https://gasvia.es"

# Google AdSense: el identificador de editor, tipo "ca-pub-1234567890123456".
# Vacío = no se muestran anuncios.
adsense = ""

# Google Search Console: el código del "meta tag" de verificación (solo el content="...").
search_console = ""

# Datos del titular para el aviso legal (obligatorios en España si la web tiene ingresos).
# Ojo: lo que pongas aquí se publica en la web y en GitHub. Déjalo vacío hasta que haga falta (ver docs/GUIA.md).
titular = ""
nif = ""
email = "contacto@gasvia.es"
# Domicilio (la LSSI también lo pide). Puede ser un apartado de correos. Vacío = no se muestra.
domicilio = ""

# Estadísticas de visitas sin cookies (GoatCounter): el código de la cuenta, p. ej. "gasvia"
# (panel en https://gasvia.goatcounter.com). Vacío = sin estadísticas.
goatcounter = "gasvia"

# Canal de Telegram donde se publica cada mañana el precio del día, p. ej. "@gasvia".
# Vacío = no se enlaza. Para publicar hacen falta además el bot y los ajustes de docs/GUIA.md.
telegram = ""
